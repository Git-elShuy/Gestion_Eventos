<link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">-->


<body>
    <!--<div class="d-flex"> -->
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar-toggle">
        <div class="sidebar-logo">
            <a routerLink="/dashboard/home">Menu</a>
        </div>
        <!-- Sidebar Navigation -->
        <ul class="sidebar-nav p-0">
            <li class="sidebar-header">
                Navegacion
            </li>
            <li class="sidebar-item">
                <a href="#" class="sidebar-link">
                    <i class="lni lni-user"></i>
                    <span>Mi perfil</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a role="button" routerLink="/dashboard/eventos" class="sidebar-link">
                    <i class="lni lni-agenda"></i>
                    <span>Eventos</span>
                </a>
            </li>
            <li *ngIf="permiso == 1 || permiso == 2" class="sidebar-item">
                <a role="button" routerLink="/dashboard/carreras" class="sidebar-link">
                    <i class="fa-solid fa-book"></i>
                    <span>Carreras</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a role="button" routerLink="/dashboard/ubicaciones" class="sidebar-link">
                    <i class="lni lni-direction"></i>
                    <span>Ubicaciones</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#" class="sidebar-link">
                    <i class="lni lni-dollar"></i>
                    <span>Ventas</span>
                </a>
            </li>

            <li *ngIf="permiso == 1 || permiso == 2" class="sidebar-header">
                Gestion de usuarios
            </li>
            <li *ngIf="permiso == 1 || permiso == 2" class="sidebar-item">
                <a class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse" data-bs-target="#auth"
                    aria-expanded="true" aria-controls="auth">
                    <i class="lni lni-user"></i>
                    <span>Usuarios</span>
                </a>
                <ul id="auth" class="sidebar-dropdown list-unstyled collapse" data-bs-parent="#sidebar">
                    <li class="sidebar-item">
                        <a routerLink="/dashboard/usuarios/gestion_usuarios" class="sidebar-link"><i class="lni lni-protection"></i>Roles y permisos</a>
                    </li>
                    <li class="sidebar-item">
                        <a role="button" routerLink="/dashboard/usuarios/registrar" class="sidebar-link"><i
                                class="lni lni-plus"></i>Crear usuario</a>
                    </li>
                </ul>
            </li>
            <li class="sidebar-item">
                <a href="#" class="sidebar-link">
                    <i class="lni lni-popup"></i>
                    <span>Notification</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="#" class="sidebar-link">
                    <i class="lni lni-cog"></i>
                    <span>Setting</span>
                </a>
            </li>
        </ul>
        <!-- Sidebar Navigation Ends -->
        <div class="sidebar-footer">
            <a class="sidebar-link" (click)="logout()">
                <i class="lni lni-exit"></i>
                <span>Salir</span>
            </a>
        </div>
        
    </aside>
</body>
