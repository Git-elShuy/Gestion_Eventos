<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="main">
        <nav class="navbar navbar-expand">
            <button class="toggler-btn" type="button">
                <i class="lni lni-text-align-left"></i>
            </button>
        </nav>
        <main class="p-3">
            <div class="container-fluid">
                <div class="mb-3 text-center">
                    <h1>Recursos</h1>
                    <!--Aqui en evento detalles carga los datos generales-->
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link" style="color: black;" role="button" (click)="GoDatosGenerales()">Datos
                                Generales</a>
                        </li>
                        <li class="nav-item">

                        <li class="nav-item">
                            <a class="nav-link" style="color: black;" role="button"
                                (click)="GoActividades()">Actividades</a>

                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" style="color: black;">Recursos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" style="color: black;" role="button"
                                (click)="GoPatrocinios()">Patrocinios</a>
                        </li>


                    </ul>
                    <div class="row">
                        <div class="col">
                            <div class="container mt-4">
                                <form action="" [formGroup]="recursoForm" (ngSubmit)="enviarFormulario()">


                                    <div class="card mb-4">
                                        <div class="card-header fw-bold">DATOS DEL RECURSO</div>
                                        <div class="card-body">

                                            <div class="row">
                                                <div class="col-md-6">
                                                    <label class="form-label">Nombre</label>
                                                    <input type="text" class="form-control" placeholder="Recurso"
                                                        formControlName="nombre">
                                                    <div
                                                        *ngIf="recursoForm.controls['nombre'].touched && recursoForm.controls['nombre'].errors">
                                                        <small *ngIf="recursoForm.controls['nombre'].errors['required']"
                                                            class="text-danger">Este campo es obligatorio.</small>

                                                        <small
                                                            *ngIf="!recursoForm.controls['nombre'].errors['required'] && recursoForm.controls['nombre'].errors['pattern']"
                                                            class="text-danger">
                                                            Caracteres no permitidos.
                                                        </small>
                                                    </div>

                                                </div>
                                                <div class="col-md-6">
                                                    <label class="form-label">Cantidad</label>
                                                    <input type="number" min="1" class="form-control"
                                                        formControlName="cantidad">
                                                    <div
                                                        *ngIf="recursoForm.controls['cantidad'].touched && recursoForm.controls['cantidad'].errors">
                                                        <small
                                                            *ngIf="recursoForm.controls['cantidad'].errors['required']"
                                                            class="text-danger">Este campo es obligatorio.</small>

                                                    </div>

                                                </div>
                                            </div>

                                            <div class="row">
                                                <div class="col md-6">
                                                    <label class="form-label">Tipo:</label>
                                                    <select class="form-control" formControlName="tipo"
                                                        (change)="verificarTipo()">
                                                        <option value="unidad">Unidad</option>
                                                        <option value="paquete">Paquete</option>
                                                        <option value="kilogramos">Kilogramos</option>
                                                    </select>
                                                </div>
                                                <div class="col md-6">
                                                    <div *ngIf="recursoForm.get('tipo')?.value === 'paquete'">
                                                        <label class="form-label">Cantidad por
                                                            paquete:</label>
                                                        <input class="form-control" type="number"
                                                            formControlName="contenido_paquete">


                                                    </div>


                                                </div>
                                            </div>
                                            <!--                                            <div class="row mt-3">
                                                <div class="col">
                                                    <label class="form-label">Evento:</label>
                                                    <select class="form-control" formControlName="evento_id"
                                                        >
                                                        <option *ngFor="let evento of eventos"
                                                            [value]="evento.idevento">
                                                            {{ evento.nombre }}
                                                        </option>
                                                    </select>

                                                </div>
                                            </div>
-->
                                        </div>
                                    </div>
                                    <div class="text-center">
                                        <button class="button-14" role="button" type="submit">Completar</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
