<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="main">
        <nav class="navbar navbar-expand">
            <button class="toggler-btn" type="button">
                <i class="lni lni-text-align-left"></i>
            </button>
        </nav>
        <main class="p-3">
            <div class="container-fluid">
                <div class="mb-3 text-center">
                    <h1>Editar patrocinio</h1>
                    <div class="row">
                        <div class="col">
                            <div class="container mt-4">
                                <form action="" [formGroup]="patrocinioForm" (ngSubmit)="enviarFormulario()">


                                    <div class="card mb-4">
                                        <div class="card-header fw-bold">DATOS DEL PATROCINIO</div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col">
                                                    <label class="form-label">Patrocinador</label>
                                                    <input type="text" class="form-control" placeholder="Nombre"
                                                        formControlName="nombrePatrocinador">
                                                    <div
                                                        *ngIf="patrocinioForm.controls['nombrePatrocinador'].touched && patrocinioForm.controls['nombrePatrocinador'].errors">
                                                        <small
                                                            *ngIf="patrocinioForm.controls['nombrePatrocinador'].errors['required']"
                                                            class="text-danger">Este campo es obligatorio.</small>

                                                        <small
                                                            *ngIf="!patrocinioForm.controls['nombrePatrocinador'].errors['required'] && patrocinioForm.controls['nombrePatrocinador'].errors['pattern']"
                                                            class="text-danger">
                                                            Caracteres no permitidos.
                                                        </small>
                                                    </div>
                                                </div>
                                                <div class="col">
                                                    <label class="form-label">Evento:</label>
                                                    <select class="form-control" formControlName="evento_id">
                                                        <option *ngFor="let evento of eventos"
                                                            [value]="evento.idevento">
                                                            {{ evento.nombre }}
                                                        </option>
                                                    </select>

                                                </div>
                                            </div>





                                        </div>
                                    </div>
                                    <div class="text-center">
                                        <button class="button-14" role="button" type="submit">Completar</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
