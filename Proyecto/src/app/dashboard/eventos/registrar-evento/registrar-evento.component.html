<div class="d-flex">
    <app-sidebar></app-sidebar>
    <div class="main">
        <nav class="navbar navbar-expand">
            <button class="toggler-btn" type="button">
                <i class="lni lni-text-align-left"></i>
            </button>
        </nav>
        <main class="p-3">
            <div class="container-fluid">
                <div class="mb-3 text-center">
                    <h1>REGISTRO DE EVENTO</h1>
                    <div class="container mt-4">
                        <form [formGroup]="eventoForm" (ngSubmit)="enviarFormulario()">

                            <!-- DATOS DEL EVENTO -->
                            <div class="card mb-4">
                                <div class="card-header fw-bold">DATOS DEL EVENTO</div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Título</label>
                                        <input type="text" class="form-control" formControlName="nombre"
                                            placeholder="Nombre del evento">
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Inicia</label>
                                            <input type="date" class="form-control" formControlName="fecha1">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Termina</label>
                                            <input type="date" class="form-control" formControlName="fecha2">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <label class="form-label">Hora</label>
                                            <input type="time" class="form-control" formControlName="hora">
                                        </div>
                                        <div class="col">
                                            <label class="form-label">Ubicación</label>
                                            <input type="text" class="form-control" formControlName="lugar"
                                                placeholder="Dirección o ubicación">
                                        </div>

                                    </div>

                                    <!--                                    <div class="mb-3">

                                    </div>-->

                                    <div class="mb-3">
                                        <label class="form-label">Descripción</label>
                                        <textarea class="form-control" formControlName="descripcion"
                                            rows="2"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- ACTIVIDADES -->
                            <div class="card mb-4">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">ACTIVIDADES</span>
                                    <i class="lni lni-plus" role="button" (click)="addActividad()"></i>

                                </div>
                                <div class="card-body" formArrayName="actividades">
                                    <div *ngFor="let act of actividadesArray.controls; let i = index"
                                        [formGroupName]="i" class="row g-2 align-items-end mb-2">
                                        <div class="col-12 col-md-3">
                                            <label class="form-label">Nombre de la actividad</label>
                                            <input type="text" class="form-control" formControlName="nombre">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">Fecha</label>
                                            <input type="date" class="form-control" formControlName="fecha">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">Hora</label>
                                            <input type="time" class="form-control" formControlName="hora">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">Lugar</label>
                                            <input type="text" class="form-control" formControlName="lugar">
                                        </div>
                                        <div class="col-6 col-md-2">
                                            <label class="form-label">Responsable</label>
                                            <input type="text" class="form-control" formControlName="responsable">
                                        </div>
                                        <div class="col-6 col-md-1">
                                            <label class="form-label">Cupos</label>
                                            <input type="number" class="form-control" formControlName="cupos" min="1">
                                        </div>
                                        <div class="col-6 col-md-1 text-end mx-auto">
                                            <button type="button" class="btn btn-outline-danger btn-sm mt-4"
                                                (click)="removeActividad(i)">🗑️</button>
                                        </div>
                                    </div>



                                </div>
                            </div>

                            <!-- ORGANIZADORES -->

                            <div class="card mb-4">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">ORGANIZADORES</span>
                                    <i class="lni lni-plus" role="button" (click)="addUsuario()"></i>

                                </div>
                                <div class="card-body" formArrayName="usuarios">
                                    <div *ngFor="let org of usuariosArray.controls; let i = index" [formGroupName]="i"
                                        class="row g-2 align-items-end mb-2">
                                        <div class="col-md-4">
                                            <label class="form-label">Nombre del organizador</label>
                                            <input type="text" class="form-control" formControlName="nombre">
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label">Rol</label>
                                            <input type="text" class="form-control" formControlName="rol">
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Contacto</label>
                                            <input type="text" class="form-control" formControlName="contacto">
                                        </div>
                                        <div class="col-md-1 text-end">
                                            <button type="button" class="btn btn-outline-danger btn-sm"
                                                (click)="removeUsuario(i)">🗑️</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- BOTÓN DE ENVÍO -->
                            <div class="text-center">
                                <button class="button-14" role="button" type="submit">Completar</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </main>
    </div>
</div>
